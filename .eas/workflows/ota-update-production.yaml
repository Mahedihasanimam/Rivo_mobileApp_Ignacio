name: Deploy to production

# on:
#   push:
#     branches: ["main"]

# Remove this line when re-enabling push trigger above

jobs:
  # ── Step 1: Check if native code changed ──────────────────────────────────
  fingerprint:
    name: Check fingerprint
    type: fingerprint
    environment: production

  # ── Step 2: Look for existing builds with same fingerprint ────────────────
  get_android_build:
    name: Check Android build
    needs: [fingerprint]
    type: get-build
    params:
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}
      profile: production

  get_ios_build:
    name: Check iOS build
    needs: [fingerprint]
    type: get-build
    params:
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      profile: production

  # ── Step 3a: Native changed → build new binaries ──────────────────────────
  build_android:
    name: Build Android (if native changed)
    needs: [get_android_build]
    if: ${{ !needs.get_android_build.outputs.build_id }}
    type: build
    params:
      platform: android
      profile: production

  build_ios:
    name: Build iOS (if native changed)
    needs: [get_ios_build]
    if: ${{ !needs.get_ios_build.outputs.build_id }}
    type: build
    params:
      platform: ios
      profile: production

  # ── Step 4a: Auto-submit new builds to stores ─────────────────────────────
  submit_android:
    name: Submit Android to Play Store
    needs: [build_android]
    if: ${{ needs.build_android.outputs.build_id }}
    type: submit
    params:
      platform: android
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: production

  submit_ios:
    name: Submit iOS to App Store
    needs: [build_ios]
    if: ${{ needs.build_ios.outputs.build_id }}
    type: submit
    params:
      platform: ios
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production

  # ── Step 3b: Native unchanged → OTA update only ───────────────────────────
  update:
    name: OTA Update (if native unchanged)
    needs: [get_android_build, get_ios_build]
    if: ${{ needs.get_android_build.outputs.build_id && needs.get_ios_build.outputs.build_id }}
    type: update
    params:
      channel: production
      message: "Automated OTA update from branch expo-ota-update"
